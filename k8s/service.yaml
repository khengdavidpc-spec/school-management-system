apiVersion: v1
kind: Service
metadata:
  name: school-postgres-svc
spec:
  selector:
    app: school-postgres
  ports:
  - port: 5432
    targetPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: school-backend-svc
spec:
  type: NodePort
  selector:
    app: school-backend
  ports:
  - port: 5000
    targetPort: 5000
    nodePort: 30500
---
apiVersion: v1
kind: Service
metadata:
  name: school-frontend-svc
spec:
  type: NodePort
  selector:
    app: school-frontend
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080